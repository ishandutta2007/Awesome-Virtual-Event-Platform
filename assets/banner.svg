<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1f" />
      <stop offset="50%" stop-color="#11103a" />
      <stop offset="100%" stop-color="#070619" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Radial Glow for Spotlight -->
    <radialGradient id="spotlight1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="spotlight2" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse-orbit {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes float-badge {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes float-badge-rev {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }

    @keyframes shimmer {
      0% { opacity: 0.4; }
      50% { opacity: 0.85; }
      100% { opacity: 0.4; }
    }

    @keyframes wave-flow {
      0% { transform: translateX(0px); }
      50% { transform: translateX(-30px); }
      100% { transform: translateX(0px); }
    }

    .shimmering {
      animation: shimmer 4s ease-in-out infinite;
    }

    .floating-1 {
      animation: float-badge 5s ease-in-out infinite;
    }

    .floating-2 {
      animation: float-badge-rev 6s ease-in-out infinite;
    }

    .orbiting {
      transform-origin: 1050px 180px;
      animation: pulse-orbit 20s linear infinite;
    }

    .grid-lines {
      stroke: #ffffff;
      stroke-opacity: 0.04;
      stroke-width: 1;
    }

    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }

    .title-main {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 46px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -1px;
    }

    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 19px;
      font-weight: 400;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="420" fill="url(#spotlight1)" rx="16" />
  <rect width="1200" height="420" fill="url(#spotlight2)" rx="16" />

  <!-- Cyber Grid Pattern -->
  <g class="grid-lines">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="250" y1="0" x2="250" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="550" y1="0" x2="550" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="850" y1="0" x2="850" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="1150" y1="0" x2="1150" y2="420" />
  </g>

  <!-- Dynamic Orbit Element (Right) -->
  <g class="orbiting" opacity="0.6">
    <circle cx="1050" cy="180" r="120" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="8 6" fill="none" />
    <circle cx="1050" cy="180" r="160" stroke="#ec4899" stroke-width="1" stroke-dasharray="4 8" fill="none" opacity="0.5" />
    <circle cx="1170" cy="180" r="7" fill="#06b6d4" filter="url(#subtle-glow)" />
    <circle cx="930" cy="180" r="5" fill="#ec4899" filter="url(#subtle-glow)" />
    <circle cx="1050" cy="20" r="6" fill="#a855f7" filter="url(#subtle-glow)" />
  </g>

  <!-- Floating Glowing Core Hub -->
  <g transform="translate(1050, 180)" class="shimmering">
    <circle cx="0" cy="0" r="45" fill="url(#cyan-grad)" opacity="0.2" filter="url(#glow-filter)" />
    <circle cx="0" cy="0" r="32" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5" />
    <!-- Stage/Broadcast Icon Inside -->
    <path d="M-10 -12 L14 0 L-10 12 Z" fill="#67e8f9" />
    <circle cx="-16" cy="-14" r="2.5" fill="#ec4899" />
    <circle cx="-16" cy="14" r="2.5" fill="#06b6d4" />
  </g>

  <!-- Left Header Content -->
  <g transform="translate(80, 75)">
    <!-- Top Pill / Badge -->
    <g class="floating-1">
      <rect x="0" y="0" width="280" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="16" r="5" fill="#10b981" class="shimmering" />
      <text x="32" y="21" class="tag-text" fill="#a5b4fc">🔥 THE DEFINITIVE DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" class="title-main">
      Awesome Virtual Event
    </text>
    <text x="0" y="140" class="title-main" fill="url(#glow-grad)" filter="url(#subtle-glow)">
      Platform Ecosystem 🚀
    </text>

    <!-- Subtitle -->
    <text x="0" y="185" class="subtitle">
      Curated SaaS &amp; Open-Source tools for Virtual Conferences, Webinars,
    </text>
    <text x="0" y="212" class="subtitle">
      Live Stages, Networking Lounges, Hybrid Expos, and WebRTC streaming.
    </text>

    <!-- Bottom Feature Tags -->
    <g transform="translate(0, 248)" class="floating-2">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="135" height="34" rx="8" fill="#1e1b4b" stroke="#3b82f6" stroke-width="1" opacity="0.9" />
        <text x="14" y="22" class="tag-text">🎙️ Live Webinars</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(145, 0)">
        <rect width="145" height="34" rx="8" fill="#1e1b4b" stroke="#ec4899" stroke-width="1" opacity="0.9" />
        <text x="14" y="22" class="tag-text">🎪 Multi-Track Expos</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(300, 0)">
        <rect width="130" height="34" rx="8" fill="#1e1b4b" stroke="#10b981" stroke-width="1" opacity="0.9" />
        <text x="14" y="22" class="tag-text">🤝 Networking</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(440, 0)">
        <rect width="145" height="34" rx="8" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1" opacity="0.9" />
        <text x="14" y="22" class="tag-text">💻 Open-Source</text>
      </g>
    </g>
  </g>

  <!-- Border Gradient Stroke -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="url(#glow-grad)" stroke-width="2" opacity="0.6" />
</svg>
